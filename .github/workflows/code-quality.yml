name: Code Quality & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality-blazor:
    name: Blazor Code Quality
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./MyDotNetApp.BlazorClient

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run dotnet format (apply changes)
        run: dotnet format --verbosity minimal

      - name: Detect formatting changes
        id: format_check
        run: |
          git status --short
          if git diff --quiet; then
            echo "No formatting changes needed."
            echo "needs_format=false" >> $GITHUB_OUTPUT
          else
            echo "Formatting changes detected. Creating patch artifact."
            git diff > format.patch
            echo "needs_format=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload formatting patch (if needed)
        if: steps.format_check.outputs.needs_format == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blazor-format-patch
          path: ./MyDotNetApp.BlazorClient/format.patch
          retention-days: 7

      - name: Build with warnings as errors
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true --no-restore

      - name: Fail if formatting required
        if: steps.format_check.outputs.needs_format == 'true'
        run: |
          echo "Code non formaté. Applique localement 'dotnet format' puis commite." >&2
          exit 1
