name: Code Quality & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  solution-quality:
    name: Solution Quality (global)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore ./MyDotNetApp.sln

      - name: Format (solution-wide)
        run: dotnet format ./MyDotNetApp.sln --verify-no-changes --severity error --verbosity minimal

      - name: Build (warnings as errors)
        run: dotnet build ./MyDotNetApp.sln --configuration Release /p:TreatWarningsAsErrors=true /p:EnableNETAnalyzers=true --no-restore

      - name: Summary
        if: always()
        run: |
          echo "### Solution Quality" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  project-quality:
    name: Project Quality (${{ matrix.project }})
    needs: [solution-quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ ApiService, BlazorClient, ServiceDefaults, AppHost ]

    defaults:
      run:
        working-directory: ./MyDotNetApp.${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Format (project)
        run: dotnet format --verify-no-changes --severity error --verbosity minimal

      - name: Build with analyzers (warnings as errors)
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true /p:EnableNETAnalyzers=true --no-restore

      - name: Project summary
        if: always()
        run: |
          echo "### Project Quality: ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
