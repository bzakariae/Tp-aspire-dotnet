name: Full CI/CD - API + Blazor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  service-defaults-build:
    name: Build ServiceDefaults
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./MyDotNetApp.ServiceDefaults

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  apphost-build:
    name: Build AppHost
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./MyDotNetApp.AppHost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish AppHost
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Inspect publish output (AppHost)
        run: |
          echo "Contents of ./publish (AppHost):" 
          ls -la ./publish || true
          echo "File count:" 
          find ./publish -type f | wc -l

      - name: Upload AppHost build
        uses: actions/upload-artifact@v4
        with:
          name: apphost-production
          path: ./MyDotNetApp.AppHost/publish
          retention-days: 30
          if-no-files-found: error

  api-build:
    name: Build API
    needs: [service-defaults-build]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./MyDotNetApp.ApiService

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Inspect publish output (API)
        run: |
          echo "Contents of ./publish (API):" 
          ls -la ./publish || true
          echo "File count:" 
          find ./publish -type f | wc -l

      - name: Upload API build
        uses: actions/upload-artifact@v4
        with:
          name: api-production
          path: ./MyDotNetApp.ApiService/publish
          retention-days: 30
          if-no-files-found: error

  blazor-build:
    name: Build Blazor
    needs: [service-defaults-build]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./MyDotNetApp.BlazorClient

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish Blazor WASM
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Inspect publish output (Blazor)
        run: |
          echo "Contents of ./publish/wwwroot (Blazor):" 
          ls -la ./publish/wwwroot || true
          echo "File count:" 
          find ./publish/wwwroot -type f | wc -l

      - name: Upload Blazor build
        uses: actions/upload-artifact@v4
        with:
          name: blazor-production
          path: ./MyDotNetApp.BlazorClient/publish/wwwroot
          retention-days: 30
          if-no-files-found: error

  deployment-ready:
    name: Deployment Ready
    needs: [api-build, blazor-build, apphost-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: List artifacts in this run
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id
            });
            core.info(`Artifacts found: ${data.artifacts.map(a => `${a.name} (${a.size_in_bytes}B)`).join(', ')}`);
            const required = new Set(['api-production','blazor-production','apphost-production']);
            const present = new Set(data.artifacts.map(a => a.name));
            for (const r of required) {
              if (!present.has(r)) {
                core.setFailed(`Missing required artifact: ${r}`);
              }
            }

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-production
          path: ./deploy/api

      - name: Download Blazor artifact
        uses: actions/download-artifact@v4
        with:
          name: blazor-production
          path: ./deploy/blazor

      - name: Download AppHost artifact
        uses: actions/download-artifact@v4
        with:
          name: apphost-production
          path: ./deploy/apphost

      - name: Create deployment package
        run: |
          cd deploy
          tar -czf deployment-package.tar.gz api/ blazor/ apphost/
      
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: full-deployment-package
          path: deploy/deployment-package.tar.gz
          retention-days: 30

      - name: Deployment summary
        run: |
          echo "### ✅ Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All builds completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🔹 API Build: Ready" >> $GITHUB_STEP_SUMMARY
          echo "- 🔹 Blazor Build: Ready" >> $GITHUB_STEP_SUMMARY
          echo "- 🔹 AppHost Build: Ready" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Deployment Package: Created" >> $GITHUB_STEP_SUMMARY